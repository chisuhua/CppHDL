# CppHDL CI/CD Pipeline
# ⚠️ **平台范围 = 仅 Ubuntu**（2026-11-03 用户裁决：「CI只做ubuntu系统,
# macos/windows不做」）⇒ ⇒ 本工作流的**所有** job 都跑在 ubuntu-22.04 上。
#   · macOS-14 的 leg **已从矩阵中移除**（它此前提供 clang/arm64 的编译覆盖）；
#   · Windows-2022 **不排期**；
#   · 「Verilator 后端 = Linux-only」这条契约（`BUILD_VERILATOR=ON` 在
#     APPLE/WIN32 上 configure 期 FATAL_ERROR）因此与 CI 范围**一致**。
#   ⇒ ⇒ 想恢复多平台覆盖 = **独立立项**（不是把 matrix 行加回来那么简单）。
#
# Fast PR feedback: Linux only (Release + Debug). Nightly job
# builds the full Verilator stack on Linux too.
#
# Design notes (2026-06 fix v2 + v3 scope-down, post-review):
# 1. Ubuntu 22.04 ships g++-11/12 in main repos; g++-13 needs the
#    ubuntu-toolchain-r PPA. We try PPA first, then fall back to
#    g++-12 (which also supports C++20 used by this project).
#    We use /usr/local/bin symlinks (not `update-alternatives --set`)
#    because the latter requires `--install` first to register the
#    alternative entry; PPA-installed g++-13 doesn't always auto-
#    register, and `--set` then fails with "no alternatives for gcc".
# 2. The JIT path (`find_package(LLVM REQUIRED)` in CMakeLists.txt,
#    enabled by default) needs LLVM dev headers. We pin
#    LLVM 22 on Linux (modern, matches local dev machines); install via
#    LLVM official APT repo (apt.llvm.org) since Ubuntu 22.04 jammy only
#    ships llvm-14 in main. (The macOS `brew install llvm@22` variant was
#    removed together with the macOS matrix leg on 2026-11-03.)
# 3. BUILD_VERILATOR defaults to ON in CMakeLists.txt; the full
#    Verilator build is 10-30 min cold and only runs in the
#    separate `nightly-verilator` job (cron + manual dispatch).
#    PRs and main-branch pushes get a fast ~5-8 min build with
#    BUILD_VERILATOR=OFF.
# 4. The schedule trigger is filtered to main branch only; develop
#    branch nightly builds would waste 10-30 min on a non-default
#    branch. workflow_dispatch is always allowed for ad-hoc
#    verification (e.g. after bumping the Verilator submodule pin).
# 5. Submodules (third_party/verilator) are still checked out for
#    the nightly job so `cmake --build --target verilator` works.
#    The fast path also checks them out so the workflow shape is
#    uniform across jobs (the init script's sanity check is
#    harmless).
# 6. ccache is persisted across runs via actions/cache keyed on
#    (build_type, sha) with a fallback restore-key for the
#    (build_type) prefix; PR feedback is materially faster.
# 7. Verilator's cold build log is uploaded as a CI artifact on
#    every run (success or failure) so a 10-30 min failure can be
#    inspected without re-running the job.

name: CppHDL CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Nightly cron: 02:00 UTC. The nightly-verilator job is gated
  # below to main branch only.
  schedule:
    - cron: '0 2 * * *'
  # Manual trigger for ad-hoc Verilator verification.
  workflow_dispatch:

# Cancel in-progress runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal GITHUB_TOKEN scope (best practice; default is write).
permissions:
  contents: read

env:
  # Pinned LLVM version across all platforms; matches Ubuntu
  # 22.04 apt.llvm.org jammy repo (llvm-22-dev), Homebrew
  # (llvm@22), and KyleMayes/install-llvm-action v2 (which
  # downloads official 22.x binaries on Windows).
  LLVM_VERSION: '22'
  # BUILD_VERILATOR=OFF for the fast default path; overridden to
  # ON in the `nightly-verilator` job below.
  BUILD_VERILATOR: 'OFF'

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # ⚠️ **仅 Ubuntu**（2026-11-03 用户裁决：CI 只做 ubuntu，macos/windows 不做）
        #    ⇒ macOS-14 / Windows-2022 **都不在矩阵里**。
        #    ⇒ 意味着**没有** clang / arm64 / MSVC 的编译覆盖 ⇒ 想要多平台覆盖
        #    MUST 走**独立立项**（含各自的已知问题清单）。
        os: [ubuntu-22.04]
        build_type: [Release, Debug]
        include:
          - os: ubuntu-22.04
            build_type: Release
            compiler: g++
            cxx_flags: "-Wall -Wextra -Wpedantic -Wshift-overflow=2"
          - os: ubuntu-22.04
            build_type: Debug
            compiler: g++
            cxx_flags: "-Wall -Wextra -Wpedantic -Wshift-overflow=2"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ---- ccache cache ------------------------------------------
    # Keyed on (runner.os, build_type, sha). Currently always
    # Linux, but the runner.os prefix is kept so re-enabling
    # other OS targets later doesn't invalidate warm caches.
    - name: Cache ccache
      if: runner.os != 'Windows'
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ matrix.build_type }}-
          ccache-${{ runner.os }}-

    # ---- Linux: g++ + LLVM --------------------------------------
    - name: Install g++ (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -e
        sudo apt-get update
        # add-apt-repository lives in software-properties-common;
        # not pre-installed on minimal runner images.
        sudo apt-get install -y software-properties-common ccache
        if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test \
           && sudo apt-get update \
           && sudo apt-get install -y g++-13; then
          echo "Installed g++-13 via PPA"
          GCC_BIN=gcc-13
          GXX_BIN=g++-13
        else
          echo "::warning::g++-13 PPA install failed, falling back to g++-12"
          sudo apt-get install -y g++-12
          GCC_BIN=gcc-12
          GXX_BIN=g++-12
        fi
        # /usr/local/bin is earlier in PATH than /usr/bin, so a
        # symlink there transparently re-points `g++`/`gcc` for
        # subsequent steps. More robust than `update-alternatives
        # --set` (which requires `--install` first to register the
        # alternative entry; PPA-installed g++-13 does not always
        # auto-register, and `--set` then fails with "no
        # alternatives for gcc").
        sudo ln -sf "/usr/bin/$GCC_BIN" /usr/local/bin/gcc
        sudo ln -sf "/usr/bin/$GXX_BIN" /usr/local/bin/g++
        g++ --version

    - name: Install LLVM (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -e
        # Add LLVM official APT repo (Ubuntu 22.04 jammy only
        # ships llvm-14 in main; llvm-22 needs apt.llvm.org).
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y llvm-${{ env.LLVM_VERSION }}-dev \
                                clang-${{ env.LLVM_VERSION }}
        # Discover LLVMConfig.cmake deterministically via dpkg
        # file list (the path is /usr/lib/llvm-22/lib/cmake/llvm/
        # LLVMConfig.cmake on Ubuntu 22.04 with the apt.llvm.org
        # jammy repo, but the dpkg lookup is robust to path changes
        # across Ubuntu releases).
        LLVM_CONFIG_CMAKE=$(dpkg -L llvm-${{ env.LLVM_VERSION }}-dev \
          | grep 'LLVMConfig\.cmake$' | head -1)
        if [ -z "$LLVM_CONFIG_CMAKE" ]; then
          echo "::error::Could not find LLVMConfig.cmake for llvm-${{ env.LLVM_VERSION }}-dev"
          exit 1
        fi
        LLVM_DIR="$(dirname "$LLVM_CONFIG_CMAKE")"
        echo "LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"
        echo "Discovered LLVM_DIR=$LLVM_DIR"

    # ---- CMake configure (BUILD_VERILATOR=OFF) ------------------
    # BUILD_VERILATOR=OFF keeps PR feedback fast (no 10-30 min
    # Verilator cold build; that moves to nightly-verilator below).
    # The JIT path is the CMakeLists default and is exercised on
    # every PR-feedback run, with the full perf suite validated
    # nightly. (macOS was removed from the matrix on 2026-11-03 =>
    # the clang-specific flags are gone with it.)
    - name: Configure CMake
      shell: bash
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
        -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
        -DENABLE_ASAN=OFF
        -DBUILD_VERILATOR=${{ env.BUILD_VERILATOR }}
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      shell: bash
      run: cmake --build build --config ${{ matrix.build_type }} -j$(nproc 2>/dev/null || echo 4)

    - name: Run tests
      shell: bash
      run: ctest --test-dir build --output-on-failure -j$(nproc 2>/dev/null || echo 4)

    - name: Verify AGENTS.md test counts
      # Single source of truth check: the documented CTest total in root
      # AGENTS.md NOTES §Test counts must match `ctest -N` at build time.
      # This prevents the historical drift where the documented number
      # (142/161) silently fell behind the actual registered count (159).
      # See openspec/changes/archive/2026-10-15-cleanup-orphan-code for the audit trail.
      # Runs on every OS in the matrix because the check is portable
      # bash (`ls | wc -l`, `grep -oE`) and the build dir / CTest
      # environment is the same on all runners.
      shell: bash
      run: scripts/verify_test_counts.sh

    - name: Verify dual-backend parity coverage count
      # Guards the **parity** count (not the label count): the 9 contract-locked
      # SINGLE-backend verilator reference implementations also carry the
      # `verilator_e2e` label => the label anchor (VERILATOR_E2E_TOTAL) cannot
      # see parity shrinkage. This guard counts the test sources that really
      # carry a `DUAL_BACKEND_TEST_PAIR(` call (comments/strings stripped) plus
      # the hand-crafted真 dual whitelist, and cross-checks them against the
      # labelled ctest entries via the CMake-generated build tree.
      # See openspec/changes/archive/2026-10-28-dual-backend-full-coverage-inventory-2026-10/design.md
      shell: bash
      run: scripts/verify_dual_backend_parity.sh

    - name: Verify dual-backend parity guard self-test
      shell: bash
      run: scripts/verify_dual_backend_parity.sh --self-test

    - name: Verify roadmap fragments consistency
      # Roadmap bookkeeping guardrail: the root AGENTS.md AUTO block and
      # .rddf/roadmap/features/*.md front-matter are TWO sources of truth
      # -> drift is silent (the historical drift was found by hand twice).
      # C1 renders the expected AUTO block from the front-matter using the
      # SAME rules as the toolchain generator and compares byte-for-byte
      # (render+compare, NOT two-way field parsing => one parser => less
      # false-positive surface).
      # C2/C3: a feature file's `### phase-N` bullets and its `## 验收标准`
      # checkboxes MUST agree on the completion symbol of the same phase
      # label / known change name (line-start mentions only).
      # ⚠️ ROOT CAUSE (corrected 2026-10-28): the toolchain payload EXISTS
      # (rdd-workflow's skills/roadmap/scripts/roadmap_update_agent_md.sh)
      # but the CLI dispatch does not expose --update-agent-md => the
      # generator is unreachable => the AUTO block is hand-maintained.
      # ⚠️ PORTABILITY: the script MUST avoid GNU-only forms (e.g. `sed -i`
      # without a suffix) => its --self-test fixtures mutate files with
      # `python3` heredocs only => BSD sed behaves identically.
      # Portable bash + python3 (also keeps the scripts usable on a
      # developer's macOS laptop, even though CI is Ubuntu-only).
      shell: bash
      run: scripts/verify_roadmap_fragments.sh

    - name: Verify roadmap fragments consistency (self-test)
      # The fixture set IS the spec of the guardrail: each fixture pins one
      # mechanism (AUTO block status mismatch / missing row / duplicate
      # front-matter key / missing sentinel / phase-label symbol conflict /
      # line-start vs mid-line mention / ambiguous phase / change-name
      # symbol conflict / narrative staleness MUST NOT be flagged).
      # WHY a self-test: this repo's guardrails repeatedly shipped
      # "looks like it works" defects (verify_perf_baseline_anchors.sh had
      # 3 real ones; verify_example_assertion_quality.sh's analyser "cannot
      # be fully closed") => every criterion needs a fixture proving it has
      # discriminating power.
      # ⚠️ The fixtures must stay portable (no `sed -i`): a GNU-only fixture
      # mutation silently does nothing on BSD sed => the self-test would
      # turn RED on a macOS laptop instead of testing anything.
      shell: bash
      run: scripts/verify_roadmap_fragments.sh --self-test

    - name: Verify rst_n wiring
      # An unwired `ch_in<ch_bool> rst_n` reads back as 0 = PERMANENTLY IN RESET:
      # the component compiles, the test builds, the simulation reports no error,
      # but every register stays at its init value -> the test is silently
      # vacuous (ZERO-COMPILE-ERROR silent breakage).
      # The check is per test case (a file that drives rst_n for one DUT would
      # otherwise mask another DUT in the same file) and per wrapper
      # (a wrapper must forward the port so an outer testbench can drive it).
      # Portable bash + awk (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_rst_n_wiring.sh

    - name: Verify FSM next-state wiring
      # ch_state_machine::build() executes EVERY state's `on_active` closure
      # once, at describe time (so that the transition_when() calls inside can
      # be registered into the next-state select tree).
      # => A register written from inside a closure is written N times, and
      #    `ch_reg::next` is LAST-WINS (regimpl::set_next == set_src(0, next))
      #    => only the LAST state to be emitted survives.
      # => An output driven from inside a closure is likewise overwritten.
      # The typical symptom is SILENT: the "load the data" branch of the FIRST
      # state never takes effect. Two real occurrences (2026-10-29):
      # examples/spinalhdl-ported/uart/uart_tx.cpp and
      # tests/test_verilator_complex_e2e.cpp (whose SPI fixture never worked;
      # its assertions were parity-only => same defect on both backends =>
      # parity stayed green).
      # Contract: capability `chlib-state-machine-semantics`.
      # Portable bash + python3 (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_fsm_next_wiring.sh

    - name: Verify FSM next-state wiring (self-test)
      # The fixture set IS the spec of the guardrail: each fixture pins one
      # mechanism (register-next write in a closure / IO assign in a closure /
      # IO <<= in a closure / write OUTSIDE a closure / IO used as an operand /
      # comment / string / nested lambda / unbalanced braces (fail-closed) /
      # on_active member-function DEFINITION (not a call) / lambda without a
      # parameter list).
      # WHY a self-test: this repo's guardrails repeatedly shipped
      # "looks like it works" defects => every criterion needs a fixture
      # proving it has discriminating power.
      # ⚠️ The guardrail and the fixtures MUST share ONE analyser
      # (scripts/lib/fsm_wiring.py) - two copies would drift.
      shell: bash
      run: scripts/verify_fsm_next_wiring.sh --self-test

    - name: Verify conditional-block assignment wiring
      # `_if` statement blocks MUST route every register / IO assignment
      # through `conditional_assign(target).next() = value`. A bare
      # `reg->next = v` inside a branch body is NOT conditionalised => it takes
      # effect UNCONDITIONALLY => the condition is silently ignored. That is
      # exactly the defect ADR-051 removed (the DSL used to ignore its
      # condition entirely), so the guardrail is the regression net for it.
      # Also asserts the REMOVED symbols (`conditional_reg_assign` /
      # `priority_if` / `priority_if_then`) do not reappear - they cannot be
      # asserted at compile time (a deleted free function is a HARD error in a
      # SFINAE context, not a deduction failure).
      # Contract: capability `chlib-conditional-semantics`.
      # Portable bash + python3 (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_if_stmt_wiring.sh

    - name: Verify conditional-block assignment wiring (self-test)
      # WHY a self-test: this repo's guardrails repeatedly shipped
      # "looks like it works" defects => every criterion needs a fixture
      # proving it has discriminating power. The fixtures cover: clean /
      # bare `->next =` / bare `io().x =` / the `conditional_assign` form /
      # a write OUTSIDE the closure / a non-lambda `then(...)` argument.
      # ⚠️ The guardrail and the fixtures MUST share ONE analyser
      # (scripts/lib/if_stmt_wiring.py, which reuses the lexer and the
      # brace-balancer from scripts/lib/fsm_wiring.py).
      shell: bash
      run: scripts/verify_if_stmt_wiring.sh --self-test

    - name: Verify get_lnode entry set
      # Contract: capability `core-lnode-entry-set` (ADR-053).
      # `get_lnode` MUST NOT have an **unconstrained generic** entry
      # (`template <typename T> ...(const T&)` without a `requires` clause).
      # Such an entry is dead for types WITH `impl()` (C++20's "more
      # constrained wins" makes the constrained overload always win) and
      # HARMFUL for types WITHOUT `impl()`: its explicit return type means
      # `requires { get_lnode(x); }` never instantiates the body => the
      # probe returns TRUE (a false positive), and the diagnostic points at
      # FRAMEWORK internals instead of the call site.
      # Portable bash + python3 (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_get_lnode_entry_set.sh

    - name: Verify get_lnode entry set (self-test)
      # WHY a self-test: the compile-time criteria (R1-R3) can only see the
      # headers the FIXTURE includes => the defect's real home
      # (`core/bundle/bundle_base.h`) is NOT among them => a compile-time
      # criterion alone SILENTLY MISSES it (measured: restoring the overload
      # left R1-R3 green). Hence R4 = a source-level scan over include/** and
      # src/**, and this self-test poisons the REAL header to prove R4 bites.
      shell: bash
      run: scripts/verify_get_lnode_entry_set.sh --self-test

    - name: Verify multi_if acceptance surface
      # Contract: capability `chlib-conditional-semantics` (ADR-052).
      # `multi_if`'s acceptance surface MUST be complete: every cell is
      # EITHER semantically correct OR loudly rejected - never a third state
      # ("compiles but is semantically wrong"). The silent forms are the
      # dangerous ones: a wider branch is truncated (a `bits<7:0>` node is
      # inserted BEFORE the mux => both backends are isomorphic => dual
      # backend parity is structurally blind, and Verilator's WIDTHTRUNC is
      # globally disabled) and a single branch ignores its condition
      # entirely (no mux is built at all).
      # Portable bash + python3 (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_multi_if_width.sh

    - name: Verify multi_if acceptance surface (self-test)
      # WHY a self-test: the compile-time criteria are only as good as their
      # fixtures. This repo has shipped "looks like it works" defects (a
      # compile-time criterion that never fired because an explicit template
      # argument bound the WRONG parameter => wider branches were silently
      # narrowed => the width criterion never ran at all).
      shell: bash
      run: scripts/verify_multi_if_width.sh --self-test

    - name: Verify conditional_assign integrity
      # Contract: capability `chlib-conditional-semantics`.
      # `conditional_assign(target).next() = value` MUST accept a BARE
      # literal (`0_d` / `0xAA_h`) just like a hardware expression.
      # The defect: the "direct write outside a conditional block" branch
      # wrote `(*out_) <<= value` => `operator<<=` => `get_lnode(driver)`
      # => `ch_literal_impl` has NO `get_lnode` overload => a bare literal
      # did NOT COMPILE (not even the framework's OWN header-comment
      # example). And because `if`/`else` are BOTH template code, that
      # branch is ALWAYS instantiated => "can it compile" is independent
      # of "which branch runs".
      # Portable bash + python3 (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_conditional_assign_integrity.sh

    - name: Verify conditional_assign integrity (self-test)
      # WHY a self-test: the criteria are only as good as their fixtures.
      # This repo has shipped "looks like it works" defects - and THIS
      # guardrail itself had one (a MISSING fixture file made the
      # compiler report "No such file" => the criterion read it as
      # "did not compile" => TWO criteria went green on a FALSE PASS).
      # Hence R0 = a fail-closed "the fixtures must exist" check.
      shell: bash
      run: scripts/verify_conditional_assign_integrity.sh --self-test

    - name: Verify multi_if output assignability (E1) and condition (E3)
      # Contract: capability `chlib-conditional-semantics`.
      # E1: a `multi_if` MUST be directly assignable to a `ch_out` (it did
      # NOT compile: `ch_out::operator=` calls `get_lnode(value)` and
      # `multi_if` has no `impl()` => no matching overload - while `select`
      # DOES accept the same operands => framework inconsistency).
      # E3: `if_then`'s condition MAY be a `ch_in<ch_bool>` port (it did NOT
      # compile: the parameter was `const ch_bool&` - while `_if` DOES
      # accept a port => framework inconsistency).
      # Both fixes live in `chlib` => ZERO `core/` changes (E1 relies on
      # ADL finding `chlib::get_lnode`).
      # Portable bash + python3 (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_multi_if_output_assignability.sh

    - name: Verify multi_if output assignability (self-test)
      # WHY a self-test: R1 only proves "it compiles" - a fixture that
      # assigns via an intermediate `ch_uint` still compiles => R1 cannot
      # catch it => R3 (source-level) is REQUIRED. This self-test proves
      # that by poisoning the fixture and observing that R1 stays green.
      shell: bash
      run: scripts/verify_multi_if_output_assignability.sh --self-test

    - name: Verify stream ready ownership
      # Contract: capability `chlib-stream-ready-ownership` (ADR-054 form E).
      # The defect: `chlib::stream_fifo`'s read enable was hard-coded to
      # `true` => the consumer was always ready => the FIFO always drained
      # => `full` was UNREACHABLE => the "FIFO full => upstream stalls"
      # backpressure scenario could not be demonstrated at all (and it
      # violated the already-signed ADR-045:160).
      # R1 = EFFECT criterion (runtime): consumer ready == 0 MUST stop the
      #      advance (NOT a lexical "source contains `true`" check - that
      #      would misjudge the legal "always-ready by default").
      # R2~R6 = structural criteria (source-level, comment-stripped).
      # Portable bash + python3 (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_stream_ready_ownership.sh

    - name: Verify stream ready ownership (self-test)
      # WHY a self-test: a criterion is only as good as its ability to
      # FAIL. This repo has shipped "looks like it works" defects (a
      # criterion that never fired because the fixture was never built).
      # This self-test POISONS THE REAL HEADER IN PLACE (a poisoned copy is
      # useless - the fixture includes the repo's own header) and proves the
      # runtime criterion turns red for 4 independent regressions, then
      # restores it and proves green again.
      shell: bash
      run: scripts/verify_stream_ready_ownership.sh --self-test

    - name: Verify chlib naming honesty registry
      # WHY: this repo has shipped THREE "the name promises a behaviour that
      # does not exist" defects (fwft_fifo promised FWFT, stream_arbiter_
      # sequence's comment promised round-robin, stream_arbiter_round_robin
      # promised rotation) => each was found by an ad-hoc audit => the next
      # one would too. The registry binds "components whose names have lied /
      # were changed" to the behaviour test that now locks their claimed
      # semantics, so drift (component deleted / judge test removed) is
      # detected mechanically.
      # R1 = registry subset of the real components; R2 = every registered
      # judge test still exists and still carries its tag; R3 = the latest
      # chlib change MUST declare the components it touched (per-change
      # obligation) and those MUST all be registered.
      # Portable bash + python3 (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_chlib_naming_honesty.sh

    - name: Verify chlib naming honesty registry (self-test)
      # WHY a self-test: a criterion is only as good as its ability to FAIL.
      # This self-test POISONS THE REGISTRY IN PLACE (pure data => the
      # equivalent discipline is "restored => green again") and proves the
      # verification turns red for 3 independent regressions.
      shell: bash
      run: scripts/verify_chlib_naming_honesty.sh --self-test

    - name: Verify header self-containment
      # WHY: the root AGENTS.md says "Headers self-contained", but that rule
      # was NEVER mechanically checked => headers that only compile thanks to
      # a lucky -I path survived for months. Measured 2026-11-03: 4 public
      # headers could not be compiled standalone, INCLUDING the public entry
      # point `#include "chlib.h"` (documented in include/AGENTS.md) — which
      # has ZERO in-repo consumers, i.e. it was never compiled at all.
      # This guard compiles every header on its own and fails if one cannot
      # (fragment headers are exempt via an explicit, two-way-checked list).
      shell: bash
      run: scripts/verify_header_self_contained.sh

    - name: Verify header self-containment (self-test)
      # WHY a self-test: a criterion is only as good as its ability to FAIL.
      # This self-test POISONS IN PLACE (one include path + two exemption-list
      # edits) and proves the verification turns red for 3 independent
      # regressions, then restores and re-verifies green.
      shell: bash
      run: scripts/verify_header_self_contained.sh --self-test

    - name: Verify stream domain closure checklist
      # The checklist (.rddf/checks/stream-domain-closure.md) is the SINGLE
      # place that says "what is still owed" for the chlib stream domain.
      # Before it existed the unpaid items were scattered across FOUR places
      # (a capability Purpose paragraph, several improvement ledgers, and an
      # ADR's out-of-scope section) => nobody could tell what was left.
      # KEY DESIGN: the checklist's "status" column is NOT a hand-written
      # claim - it is DERIVED from the pointer set (a green row MUST carry
      # spec + test + guard; a red row MUST carry a debt pointer and MUST
      # NOT carry test + guard) => the checklist cannot contradict itself.
      # Portable bash + python3 (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_stream_domain_closure.sh

    - name: Verify stream domain closure checklist (self-test)
      # WHY a self-test: a criterion is only as good as its ability to FAIL.
      # This self-test POISONS THE CHECKLIST IN PLACE and proves the
      # verification turns red for 4 independent regressions, then restores
      # it and proves green again.
      # NOTE: the checklist is pure data => "the mutation still compiles" does
      # not apply; the equivalent discipline is "restored => green again".
      shell: bash
      run: scripts/verify_stream_domain_closure.sh --self-test

    - name: Verify ledger evidence (discipline M)
      # WHY: three times in one session, a conclusion was written down BEFORE
      # the measurement that refuted it (builder "silent word loss", the XML
      # criterion, the cost unit). The common shape is "conclusion first,
      # measurement later" => the ledger must carry machine-checkable evidence.
      # FAIL-CLOSED: evidence pointing at a missing / unregistered source file,
      # or at a /tmp probe (vanishes with the session), is a FAIL. A missing
      # `evidence:` field is a WARN + named list (historical ledgers are not
      # blocked yet, but the gap is VISIBLE).
      shell: bash
      run: scripts/verify_ledger_evidence.sh

    - name: Verify ledger evidence (self-test)
      # WHY a self-test: a criterion is only as good as its ability to FAIL.
      # This one POISONS A LEDGER IN PLACE (evidence -> a non-existent file)
      # and proves the check turns red, then restores and proves green again.
      shell: bash
      run: scripts/verify_ledger_evidence.sh --self-test

    - name: Verify deprecation callsites (0 new call sites)
      # ADR-036 marked 8 `ch_bool` / `port<ch_bool>` `&&` / `||` overloads as
      # [[deprecated]] and set "0 new call sites" as the phase-5 completion
      # condition -- but NOTHING enforced it => the condition was a one-off
      # manual check => a new misuse today would NOT turn CI red (only a
      # deprecation warning in the build log, and the build is not -Werror).
      # R1 = the 8 markers are still in place (and the total is exactly 8);
      # R2 = every detected deprecated call site is on the exemption list;
      # R3 = every exemption still exists (bidirectional, no silent drift).
      shell: bash
      run: scripts/verify_deprecation_callsites.sh

    - name: Verify deprecation callsites (self-test)
      # WHY a self-test: the criterion is only as good as its ability to FAIL.
      # It POISONS IN PLACE (injects a new call site / removes a marker /
      # drops or mis-numbers a registration) and proves each turns the check
      # red, then restores and proves green again (and byte-identical to HEAD).
      shell: bash
      run: scripts/verify_deprecation_callsites.sh --self-test

    - name: Verify deprecation calendar gate
      # ADR-036 §8.1: "reject any removal commit before 2027-04-17" -- but that
      # calendar lock was enforced by good intentions only. If the 8 markers
      # disappear, this computes the removal date (uncommitted => today, else
      # the commit that flipped them) and compares it against the effective
      # deadline (2027-04-17, rolled forward to 2027-07-17 by the §8.2
      # low-activity clause: < 5 commits in the window).
      # FAIL-CLOSED: markers gone but the date cannot be proven => FAIL.
      shell: bash
      run: scripts/verify_deprecation_calendar_gate.sh

    - name: Verify deprecation calendar gate (self-test)
      # Two cases with opposite expectations: removing the markers MUST turn
      # the gate RED (today < deadline), while widening the deadline to the
      # past MUST turn it GREEN -- the latter is the NEGATIVE CONTROL that
      # proves the red verdict comes from the DATE, not from the mere absence
      # of the markers.
      shell: bash
      run: scripts/verify_deprecation_calendar_gate.sh --self-test

    - name: Verify example test wiring
      # Every example-local test source MUST have a home: either registered
      # into CTest (`add_test`) or explicitly listed in
      # `examples/disabled_examples.txt` with a reason + a re-entry condition.
      # Before 2026-10-23 the 19 `examples/riscv-mini/` Catch2 targets were
      # built on every CI run but NEVER executed (their `add_test()` was a
      # no-op because `enable_testing()` came after `add_subdirectory(examples)`),
      # and 4 more test sources were not compiled at all -> silent rot.
      # C1 = per-target/source attribution, C2 = count conservation
      # (guards against the protected set silently shrinking).
      # Portable bash + grep + awk + find (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_example_test_wiring.sh

    - name: Verify example assertion quality
      # Assertion-quality guardrail (split out of verify_example_test_wiring.sh
      # on 2026-10-24): the wiring guardrail owns *attribution* (is the test
      # source executed at all?), this one owns *assertion quality* (does the
      # executed test actually assert a semantic output, or is it SUCCEED-only?).
      # ⚠️ Its static analyser is a hand-rolled C-subset lexer and therefore
      # NOT fully closable — hence a separate change
      # (example-assertion-quality-2026-10) owns it, with a fixture set as spec.
      shell: bash
      run: scripts/verify_example_assertion_quality.sh

    - name: Verify assertion quality fixtures (spec)
      # The fixture set IS the spec of the assertion-quality guardrail:
      # each fixture pins one mechanism (comment stripping / macro bodies /
      # #elif dead branches / word boundary / throws-only / SUCCEED-only ...)
      # with its expected executable-assertion counts.
      # WHY A SEPARATE SCRIPT (not assertions inside the guardrail): the guardrail
      # and the spec MUST share ONE analyser implementation
      # (scripts/lib/assertion_quality.sh) - two copies would drift, which is
      # exactly how C1's review rounds 4/5/6 found their BLOCKERs.
      # Also checks the guardrail's fail-closed behaviour (empty output /
      # missing end marker MUST be reported as violations, never as a false OK).
      shell: bash
      run: scripts/verify_assertion_quality_fixtures.sh

    - name: Verify RV32I single-source convergence
      # ADR-046 guardrail (change rv32i-canonical-convergence-2026-10):
      #   C1 no same-basename duplicate headers between include/cpu/** and
      #      examples/riscv-mini/src/** (disambiguation MUST NOT depend on -I order)
      #   C2 root tests/CMakeLists.txt MUST NOT add examples/riscv-mini/src to -I
      #   C3 root tests/** MUST NOT #include examples/** paths (layer inversion)
      #   C4 no zero-consumer headers (dead code MUST be deleted, not "promoted back")
      # ⚠️ C4's dead-header verdict uses TWO independent evidence sources
      # and only reports a header as dead when BOTH say "no includer" AND
      # source ② is trustworthy:
      #   source ① = **basename textual mention** (NO include-form parsing).
      #     A file containing the string `foo.h` may #include that header in
      #     ANY form (quotes / angle brackets / macro `#include HDR` /
      #     line continuation / repo-root-relative path / -I variance).
      #     => there is no "unparsed form" state at all => no parse failure
      #     possible. Continuation joins follow C++ semantics (drop `\` +
      #     newline, concatenate the rest VERBATIM -- inserting a space would
      #     silently corrupt the basename and kill a live header).
      #     Self-mentions (`/** @file foo.h */`, present in 29 of 31 headers)
      #     MUST be excluded BY FILE IDENTITY, otherwise every header would be
      #     permanently "alive" and C4 would lose all discriminating power.
      #     Cost: under-report only (a comment mentioning a dead header's name
      #     keeps it alive) -- never a false "dead" verdict.
      #   source ② = compiler `.d` basenames, trustworthy iff there is .d
      #     evidence AND every .d file belongs to THIS tree.
      # .d evidence is NEVER filtered by target name (the name extraction has
      # blind spots => filtering would drop real .d records => a live header
      # would be judged dead). Conservative: may under-report; it NEVER reports
      # a live header as dead — if either source sees an includer, the header
      # is treated as alive.
      # ⚠️ Fail-closed probes: an out-of-surface C/C++ extension (.c/.inl/.hxx)
      # is a violation (source ① could not see its #include), and the awk pass
      # MUST report as many TU files as the scan surface contains (crash or
      # partial read => violation).
      # ⚠️ The "source has an includer but no TU compiled it" shape is a
      # WARNING only, never a violation (it may be transitive deadness OR a
      # target-name extraction blind spot => a violation could lead an agent
      # to delete a LIVE header).
      shell: bash
      run: scripts/verify_no_duplicate_rv32i_headers.sh

    - name: Verify RV32I single-source convergence (self-test)
      # The guardrail's OWN regression test: builds a synthetic tree and asserts
      # each of the 6 checks has discriminating power (a clean tree MUST pass;
      # each injected mutation MUST be caught). Without it, a defect in the
      # guardrail itself would be invisible until it silently stopped guarding.
      shell: bash
      run: scripts/verify_no_duplicate_rv32i_headers.sh --self-test

    - name: Verify perf baseline anchor conservation
      # `tests/benchmark/perf_baseline.json` is the reference for
      # `perf_regression`, whose judgement is
      # `if (base <= 0.0) continue;` — a row with `median_us == 0` is SKIPPED
      # forever, so losing an anchor makes that regression permanently
      # invisible (real incident 2026-10-25: 6 TC-09 anchors were dropped when
      # the baseline was regenerated). Three checks:
      #   C1 row set MUST equal the reference row set (no silent row loss)
      #   C2 every reference anchor (status=PASS and median_us>0) MUST still
      #      exist AND still be > 0 — the judgement is PER ROW (not a count
      #      comparison), so a row that was downgraded to 0 is caught
      #      ("no degrade to 0" escape). A `note_restored` marker is NOT an
      #      escape: such a row MUST assert its median_us equals the
      #      reference value verbatim.
      #   C3 any looseness (an anchor raised / a row that got slower) MUST be
      #      disclosed in the baseline's `note` field, keyed by
      #      (test, params, backend) AND with matching old=/new=/ratio=
      #      numbers — otherwise a regenerated baseline could silently accept
      #      a real regression. The thresholds are read from
      #      `tests/benchmark/perf_regression.cpp` (the authoritative
      #      `kBackendThresholds`); an unreadable/unparsable authority is
      #      FAIL-CLOSED (no built-in fallback copy).
      # ⚠️ Reference commit: on PRs it is the PR's BASE BRANCH (fetched
      # explicitly — actions/checkout's default refs do not include it); on
      # push it is `HEAD`, where the check passes trivially (a shallow clone
      # has no `HEAD^`). This gate bites at PR time, where a regenerated
      # baseline is reviewed.
      shell: bash
      run: |
        REF="HEAD"
        if [ -n "${{ github.base_ref }}" ]; then
          # ⚠️ fetch 失败 MUST **硬失败**（不加 `|| true`）：fetch 失败意味着
          #    「基准取不到」⇒ 闸门**跑不了** ⇒ 若吞掉它，脚本会走
          #    「ref 解析不到 ⇒ ::warning + 跳过」路径 ⇒ 这道闸门在 PR 上
          #    **静默失效**，而 CI 仍显示绿（第六轮审稿 SHOULD_FIX-4）。
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          REF="origin/${{ github.base_ref }}"
        fi
        # The guard's own regression test runs FIRST: three of its checks were
        # found broken during development (a stale `RC=$?` swallowed the exit
        # code; the disclosure check accepted unrelated token mentions; and a
        # `note_restored` JSON marker was a "degrade to 0" escape hatch), so an
        # untested guard here would be a gate that only looks like one.
        scripts/verify_perf_baseline_anchors.sh --self-test
        scripts/verify_perf_baseline_anchors.sh "$REF"

    - name: Verify OpenSpec delta self-check
      # 4 rules distilled from the four rounds of adversarial review of the
      # 2026-10-22 changes (samples-regression-guard /
      # bundle-ecosystem-hardening): a delta must not name its own change
      # (it is merged verbatim into the main spec), must not carry
      # placeholder paths, MODIFIED titles must match the main spec
      # character-for-character (otherwise the CLI silently skips the
      # merge), and every verify block must be syntactically reachable.
      # Portable bash + awk + sed (runs on every OS in the matrix).
      shell: bash
      run: scripts/verify_openspec_delta.sh

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ runner.os }}-${{ matrix.build_type }}
        path: build/Testing/Temporary/*.xml
        if-no-files-found: ignore

    - name: Upload compile commands
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: compile-commands-${{ runner.os }}-${{ matrix.build_type }}
        path: build/compile_commands.json
        if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Code quality checks (Linux only)
  # ---------------------------------------------------------------
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install g++ (Linux)
      shell: bash
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test \
           && sudo apt-get update \
           && sudo apt-get install -y g++-13; then
          echo "Installed g++-13 via PPA"
          GCC_BIN=gcc-13
          GXX_BIN=g++-13
        else
          echo "::warning::g++-13 PPA install failed, falling back to g++-12"
          sudo apt-get install -y g++-12
          GCC_BIN=gcc-12
          GXX_BIN=g++-12
        fi
        sudo ln -sf "/usr/bin/$GCC_BIN" /usr/local/bin/gcc
        sudo ln -sf "/usr/bin/$GXX_BIN" /usr/local/bin/g++
        g++ --version

    - name: Install LLVM and clang-tidy
      shell: bash
      run: |
        set -e
        # Add LLVM official APT repo (Ubuntu 22.04 jammy only
        # ships llvm-14 in main; llvm-22 needs apt.llvm.org).
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        # Pin clang-tidy to the same LLVM major version as the
        # build jobs, so diagnostics are consistent. Default apt
        # clang-tidy is 10 on Ubuntu 22.04, which gives different
        # results from LLVM 14.
        sudo apt-get install -y llvm-${{ env.LLVM_VERSION }}-dev \
                                clang-${{ env.LLVM_VERSION }} \
                                clang-tidy-${{ env.LLVM_VERSION }}
        # Register clang-tidy-22 as the default `clang-tidy` so
        # `run-clang-tidy` (a pip wrapper) invokes the pinned
        # version. `update-alternatives --install` is idempotent on
        # the same path; re-running this step is safe.
        sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy \
          /usr/bin/clang-tidy-${{ env.LLVM_VERSION }} 100
        LLVM_CONFIG_CMAKE=$(dpkg -L llvm-${{ env.LLVM_VERSION }}-dev \
          | grep 'LLVMConfig\.cmake$' | head -1)
        if [ -z "$LLVM_CONFIG_CMAKE" ]; then
          echo "::error::Could not find LLVMConfig.cmake for llvm-${{ env.LLVM_VERSION }}-dev"
          exit 1
        fi
        LLVM_DIR="$(dirname "$LLVM_CONFIG_CMAKE")"
        echo "LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"
        echo "Discovered LLVM_DIR=$LLVM_DIR"

    - name: Configure CMake
      shell: bash
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_VERILATOR=${{ env.BUILD_VERILATOR }}
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run clang-tidy
      shell: bash
      run: |
        python3 -m pip install --quiet run-clang-tidy
        # Check both src/ cpp files and include/ headers. The
        # latter is the public API surface where inline-defined
        # bugs hide; -header-filter='.*' is the right scope.
        run-clang-tidy -p build -j$(nproc) \
          -checks='readability-*,modernize-*,performance-*,bugprone-*' \
          -header-filter='.*' \
          'src/.*\.cpp$' 'include/.*\.h$'
      continue-on-error: true

  # ---------------------------------------------------------------
  # samples regression guard (Linux only).
  #
  # `samples/` had ZERO automated coverage until this job: the 40
  # sample source files were never executed by ctest nor by
  # run_all_ported_tests.sh, so two of them had been segfaulting
  # for months without anybody noticing.
  #
  # Linux-only: the guard needs a POSIX `timeout` (GNU coreutils);
  # macOS has no `timeout` by default (it ships `gtimeout` via
  # brew coreutils), so the job would be platform-dependent there.
  #
  # Budget: 26 samples x 60s timeout = 26 min worst case, plus the
  # library build. `timeout-minutes: 30` caps it.
  # ---------------------------------------------------------------
  samples-regression:
    name: Samples Regression Guard
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      BUILD_VERILATOR: 'OFF'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install g++ (Linux)
      shell: bash
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test \
           && sudo apt-get update \
           && sudo apt-get install -y g++-13; then
          echo "Installed g++-13 via PPA"
          GCC_BIN=gcc-13
          GXX_BIN=g++-13
        else
          echo "::warning::g++-13 PPA install failed, falling back to g++-12"
          sudo apt-get install -y g++-12
          GCC_BIN=gcc-12
          GXX_BIN=g++-12
        fi
        sudo ln -sf "/usr/bin/$GCC_BIN" /usr/local/bin/gcc
        sudo ln -sf "/usr/bin/$GXX_BIN" /usr/local/bin/g++
        g++ --version

    - name: Install LLVM
      shell: bash
      run: |
        set -e
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/llvm-toolchain-jammy-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y llvm-${{ env.LLVM_VERSION }}-dev \
                                clang-${{ env.LLVM_VERSION }}
        LLVM_CONFIG_CMAKE=$(dpkg -L llvm-${{ env.LLVM_VERSION }}-dev \
          | grep 'LLVMConfig\.cmake$' | head -1)
        if [ -z "$LLVM_CONFIG_CMAKE" ]; then
          echo "::error::LLVMConfig.cmake not found for llvm-${{ env.LLVM_VERSION }}-dev"
          exit 1
        fi
        LLVM_DIR="$(dirname "$LLVM_CONFIG_CMAKE")"
        echo "LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"

    - name: Configure CMake
      shell: bash
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_CXX_COMPILER=g++
        -DENABLE_ASAN=OFF
        -DBUILD_VERILATOR=${{ env.BUILD_VERILATOR }}

    # Only the samples (+ the library they link against) are built here;
    # the test suite is the `build-and-test` job's business.
    - name: Build samples
      shell: bash
      run: cmake --build build --target all-samples -j$(nproc 2>/dev/null || echo 4)

    - name: Run samples regression guard
      shell: bash
      run: bash scripts/run_all_samples.sh

