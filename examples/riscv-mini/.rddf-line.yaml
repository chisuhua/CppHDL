# 产品线 marker（ADR-078 D8 · S4c-0）
#
# ⚠️ **一条产品线 = 两个成员目录**（IP 级 + SoC 级）⇒ 本文件放在该线的 **IP 级目录**
#    （产品线的锚点）⇒ ⇒ `line` == 所在目录名 ⇒ ⇒ 目录改名 MUST 同步改本文件。
# ⚠️ 本文件是**该产品线的唯一真相**（产品线身份 / 范围 / 关联决策）⇒ 中央登记面
#    （`.rddf/checks/product-lines.md`）是**从本文件派生**的派生物。
#
# 判据：`scripts/verify_product_lines.sh` 的 C1/C2（发现集 == 登记集 · 字段完备 · 归属完备）

line: riscv-mini
layer: ip

# 该产品线的**全部**成员目录（每个 MUST 存在）
members:
  - examples/riscv-mini
  - examples/riscv-soc

# 关联 ADR（`docs/adr/ADR-NNN-*.md` MUST 存在）
adrs:
  - ADR-035
  - ADR-046
  - ADR-047
  - ADR-069
  - ADR-077

# 关联 capability（`openspec/specs/<name>/` MUST 存在）
specs:
  - rv32i-isa-semantics
  - rv32i-data-forwarding
  - rv32i-memory-timing
  - rv32i-dcache-timing
  - cpu-cache-subsystem
  - rv32i-mmio-channel
