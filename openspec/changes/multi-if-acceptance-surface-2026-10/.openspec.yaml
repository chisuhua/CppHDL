# 实施 ADR-052（`docs/adr/ADR-052-multi-if-acceptance-surface.md`）。
#
# 本 change 把 `chlib::multi_if` 的接受面从「框架放行无法正确执行的形态」
# 收敛为「要么语义正确、要么响亮拒绝」。五种形态（A–E）逐一处置。
#
# ⚠️ 破坏性变更（仓内零消费者，外部使用者受影响）：
#   B / D / E 从「能编译」变「编译期拒绝」；C 从「编译失败」变「可用」。
#   ⇒ MUST 在 proposal 的 Impact 与 ADR-052 §4 双向公告。
#
# ⇒ 归档**禁** `--skip-specs`（capability `chlib-conditional-semantics` 是 delta）。
