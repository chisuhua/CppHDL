# ⚠️ **规范所有者**：本 capability 管的是**用户面诊断 API 的契约**
#   （入口 · 只读 · 报告内容 · 不可分析时的行为），**不是**产物契约
#   （产物契约归 `rtl-hierarchical-output`）。
#
# ⇒ **新建 1 个 capability** ⇒ 归档**禁** `--skip-specs`。
