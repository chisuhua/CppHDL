# 公共头 ODR 安全 —— `include/module.h` 的自由函数缺 `inline`。
#
# 这是层次化 RTL 输出（`hierarchical-rtl-output-2026-11`）的**唯一硬前置**：
# 层次化 emitter 是**库级**代码 ⇒ 任何 2+ TU 的下游项目都会被该缺陷咬。
#
# ⚠️ 为什么独立成 change（不并进层次化）：
# ① 它与层次化**零语义耦合**（只加 1 个 `inline`）；
# ② 它的回归面是**链接期**，层次化的回归面是**产物文本 / 逐拍等价**⇒ 判据完全不同
#    ⇒ 合并会让「链接失败」与「产物不等」两类红混在一起 ⇒ 无法归因。
#
# ⇒ **新建 1 个 capability** ⇒ 归档**禁** `--skip-specs`。
