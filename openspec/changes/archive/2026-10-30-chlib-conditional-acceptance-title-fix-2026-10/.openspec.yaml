created: 2026-10-30
# 本 change 是一个**纯规格修正**（**零**行为变更、**零**代码改动）：
# 把 capability `chlib-conditional-semantics` 的
# 「`multi_if` 的接受面 MUST 完备」Requirement 的**标题**里
# 「要么语义正确、要么**编译期**拒绝」改成「要么语义正确、要么**响亮拒绝**」。
#
# ⚠️ **为什么**：该 Requirement 的**正文**本来就是对的 ——
#   「MUST 要么**语义正确**、要么**响亮拒绝**（编译期 `static_assert` 或
#   建图期 `CHFATAL_EXCEPTION`）」⇒ ⇒ 但**标题**只说了「编译期拒绝」
#   ⇒ ⇒ **不准确**：形态 **B**（单分支）与形态 **D** 的**字面量值域检查**
#   是**建图期**拒绝（`CHFATAL_EXCEPTION`）⇒ ⇒ 标题与正文**自相矛盾**
#   ⇒ ⇒ 读者会以为形态 B 是编译期拒绝 ⇒ ⇒ 修复者会去找错的地方。
#
# ⇒ 本 change **只**改标题；正文与**全部** Scenario 逐字保留。
#
# ⇒ 归档**禁** `--skip-specs`（MODIFIED delta）。
